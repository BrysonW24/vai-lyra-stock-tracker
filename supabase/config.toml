# Supabase project config — required for the CLI and the GitHub branching integration.
# Replace project_id with your project ref (Supabase dashboard → Settings → General).
# Migrations in supabase/migrations/ are applied to preview branches on every PR and to
# production on merge. See docs/MULTI-USER-GO-LIVE.md.

project_id = "your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local dev value; set your real site URL in the Supabase dashboard per environment.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
