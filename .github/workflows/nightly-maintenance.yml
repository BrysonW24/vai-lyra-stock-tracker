name: Nightly Maintenance

# The loop-closer: after the US session, label signal outcomes (forward returns +
# coaching follow-ups), run the horizon-2 workers (events/IPOs, fundamentals,
# intelligence - dormant with no scheduler until now), send the daily digest
# (weekly report on Fridays), and sweep the notification delivery log (release
# held events, retry-once failed sends). Every job is demo-safe: with no secrets
# configured each step no-ops cleanly.

on:
  schedule:
    # 22:05 UTC = after the US close year-round (20:00 EDT / 21:00 EST close).
    - cron: '5 22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEFAULT_USER_ID: ${{ secrets.DEFAULT_USER_ID }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL }}
      NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      # Horizon-2 workers first so tonight's digest can see today's events/fundamentals.
      # Each is best-effort: one failing source must not block outcome labeling.
      - name: Events + IPO worker
        run: python -m workers.events_worker.main || echo "events worker failed (non-fatal)"
      - name: Fundamentals worker
        run: python -m workers.fundamentals_worker.main || echo "fundamentals worker failed (non-fatal)"
      - name: Intelligence worker
        run: python -m workers.intelligence_worker.main || echo "intelligence worker failed (non-fatal)"

      - name: Label signal outcomes + send follow-ups
        run: python -m workers.stock_scanner.outcome_job

      - name: Send daily digest (weekly report on Fridays)
        run: python -m workers.stock_scanner.digest_job

      - name: Sweep notification deliveries (release held, retry failed)
        if: env.APP_BASE_URL != '' && env.NOTIFICATION_DISPATCH_SECRET != ''
        run: |
          curl -sf -X POST "$APP_BASE_URL/api/notifications/dispatch" \
            -H "content-type: application/json" \
            -H "x-notification-secret: $NOTIFICATION_DISPATCH_SECRET" \
            --data '{"sweep":true}'

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
        run: |
          MSG="Lyra nightly maintenance FAILED - run ${{ github.run_id }} on ${{ github.repository }}. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" > /dev/null || true
          fi
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -sf -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: $MSG\"}" "$SLACK_WEBHOOK" > /dev/null || true
          fi

      - name: Keepalive (reset the 60-day cron auto-disable clock)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nightly-maintenance.yml/enable" || true
