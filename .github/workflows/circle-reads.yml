name: Circle Reads

# The circle's two scheduled reads on Telegram (src/lib/circle/, v0.144.0): a short world read sent
# privately to each member of the founder's invite-only circle, with their own names first. This job
# only rings the bell - it signs one request (scripts/circle-read.mjs) and the app that holds the bot
# composes and sends the read (POST /api/circle/broadcast). No database, no paid key: the figures are
# the world board's, the one short note is written by the free open-model pool, and each read is sent
# once per Sydney day whichever firing gets there first.
#
# When. Members are told about 8:45am and about 7:15pm Sydney, and that holds all year: cron strings
# are UTC and do not move for daylight saving, so each read fires for both halves of the year, and
# the app does nothing on a firing that comes before the read's Sydney time (status too_early).
#   morning  21:45 + 22:15 UTC Mon-Fri = 08:45 + 09:15 AEDT (Oct-Apr), Tue-Sat in Sydney
#            22:45 + 23:15 UTC Mon-Fri = 08:45 + 09:15 AEST (Apr-Oct)
#            Wall Street has closed, Europe closed overnight, Asia opens at 11:00 Sydney.
#   evening  08:15 + 08:45 UTC Mon-Fri = 19:15 + 19:45 AEDT
#            09:15 + 09:45 UTC Mon-Fri = 19:15 + 19:45 AEST
#            Every Asian market has closed (Hong Kong last) and Europe is in its first hour.
# In each season the second firing, half an hour later, is the retry: it sends only to members the
# first did not reach, and does nothing once every copy has gone (status already_sent). A board that
# still cannot be read on the retry pages the operator.
#
# This repository is public, so its logs are: the script prints counts only.
on:
  schedule:
    - cron: '45 21 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '45 22 * * 1-5'
    - cron: '15 23 * * 1-5'
    - cron: '15 8 * * 1-5'
    - cron: '45 8 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '45 9 * * 1-5'
  workflow_dispatch:
    inputs:
      kind:
        description: Which read
        type: choice
        options: [morning, evening]
        default: morning
      rehearsal:
        description: Rehearse - send it to the owners only, marked as a rehearsal
        type: boolean
        default: true
      force:
        description: Send again even if today's read already went out
        type: boolean
        default: false

# Least privilege. `actions: write` is only for the keepalive step (see its action for why).
permissions:
  contents: read
  actions: write

concurrency:
  group: circle-reads
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Send the read
        env:
          UPDATES_PUBLISH_SECRET: ${{ secrets.UPDATES_PUBLISH_SECRET }}
          LYRA_CIRCLE_URL: ${{ vars.LYRA_CIRCLE_URL || 'https://lyra.vivacityai.com.au' }}
          # A scheduled run picks its read from the hour it fired in; a manual run from the inputs.
          KIND: ${{ inputs.kind || (contains(fromJSON('["15 8 * * 1-5","45 8 * * 1-5","15 9 * * 1-5","45 9 * * 1-5"]'), github.event.schedule) && 'evening' || 'morning') }}
          REHEARSAL: ${{ inputs.rehearsal && '--rehearsal' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/circle-read.mjs "$KIND" $REHEARSAL $FORCE

      - name: Keepalive (reset the 60-day cron auto-disable clock)
        if: always()
        uses: ./.github/actions/keepalive
        with:
          token: ${{ github.token }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: Lyra circle read FAILED
          telegram-bot-token: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          slack-webhook: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
