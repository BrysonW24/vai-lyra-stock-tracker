name: CI

# Quality gates on every push + PR: the frontend (type-check, lint, unit tests, build) and the
# Python worker (pytest). Keeps main deployable - a red gate here blocks a broken merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Server-side version enforcement. The pre-push hook is client-side only: a clone that
  # never ran npm install, a GitHub web edit, or VD_SKIP_VERSION=1 all bypass it silently.
  # This job replays the same guard against the PR base (or the pre-push commit), so
  # unversioned shippable changes cannot land no matter how they were pushed.
  version-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce version bump on shippable changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Point the ref the guard compares against at the true base of this change set.
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git update-ref refs/remotes/origin/main "$BASE_SHA"
          fi
          node scripts/check-version-bump.mjs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Node 24 = the major production runs on (Vercel project setting + package.json engines).
      # This job sat on Node 20 while the lockfile moved to packages that need >= 22 (jsdom 30,
      # undici 8, supabase-js 2.110): every DOM test crashed at worker start and CI was red for
      # 59 consecutive pushes (2026-07-28 to 2026-09-08). Test on what you ship on.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Onboarding parity (human + html + agent surfaces vs the codebase)
        run: npm run check:onboarding
      - name: Onboarding contract (captured values are persisted, read, and reach the AI)
        run: npm run check:onboarding-contract
      - name: Migration integrity (unique versions, no silent table-shape collisions)
        run: npm run check:migrations
      - name: Skill-chain coverage (every code section has an owning chain)
        run: npm run check:chains
      - name: Learning ledgers parse clean (a ledger that stops parsing stops teaching)
        run: npm run check:ledgers
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # Build must succeed with NO secrets - the app falls back to demo mode. This proves a
          # fresh clone builds green before any keys exist.
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Static routes stayed static (public pages are served from the edge, not a function)
        run: npm run check:static-routes

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-worker
      - name: Worker tests
        run: python -m pytest tests -q

  # A fresh clone must be able to build the ENTIRE schema from an empty database - every
  # migration in order, then the sql/ reconcile. The 0.36.0 incident (a fresh install
  # failed outright on a migration-ordering bug, and four migrations had silently never
  # reached prod) is the class this kills: schema buildability is now a gate, not a hope.
  migrations-from-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyra_zero
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply every migration + reconcile against an empty database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyra_zero
        run: bash scripts/migrate-from-zero.sh
      # The schema is now built - so this is the one place CI can check that every column the app
      # NAMES in a read actually exists. v0.132.0 named five that did not; nothing else in CI knows
      # what columns a table has, and the dashboard served demo data to every user until caught.
      - name: Every column the app names exists in the schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyra_zero
        run: node scripts/check-app-columns.mjs

  # Nothing blocks a push to main here (no branch protection - the flow is direct push behind a
  # local pre-push gate), so a red CI on main has to reach a person some other way. It did not:
  # 59 consecutive red runs shipped without anyone being told. Pull requests are left alone -
  # their author is already looking at the checks.
  notify:
    needs: [version-guard, frontend, worker, migrations-from-zero]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-failure
        with:
          title: "Lyra CI is RED on main (${{ github.sha }})"
          detail: "version-guard=${{ needs.version-guard.result }} frontend=${{ needs.frontend.result }} worker=${{ needs.worker.result }} migrations=${{ needs.migrations-from-zero.result }}"
          telegram-bot-token: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          slack-webhook: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
