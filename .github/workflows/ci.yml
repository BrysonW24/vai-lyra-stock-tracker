name: CI

# Quality gates on every push + PR: the frontend (type-check, lint, unit tests, build) and the
# Python worker (pytest). Keeps main deployable - a red gate here blocks a broken merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # Build must succeed with NO secrets - the app falls back to demo mode. This proves a
          # fresh clone builds green before any keys exist.
          NEXT_TELEMETRY_DISABLED: '1'

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install worker dependencies
        run: pip install -r requirements.txt
      - name: Worker tests
        run: python -m pytest tests -q
