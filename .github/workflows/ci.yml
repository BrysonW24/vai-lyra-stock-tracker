name: CI

# Quality gates on every push + PR: the frontend (type-check, lint, unit tests, build) and the
# Python worker (pytest). Keeps main deployable - a red gate here blocks a broken merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Server-side version enforcement. The pre-push hook is client-side only: a clone that
  # never ran npm install, a GitHub web edit, or VD_SKIP_VERSION=1 all bypass it silently.
  # This job replays the same guard against the PR base (or the pre-push commit), so
  # unversioned shippable changes cannot land no matter how they were pushed.
  version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce version bump on shippable changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Point the ref the guard compares against at the true base of this change set.
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git update-ref refs/remotes/origin/main "$BASE_SHA"
          fi
          node scripts/check-version-bump.mjs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Onboarding parity (human + html + agent surfaces vs the codebase)
        run: npm run check:onboarding
      - name: Skill-chain coverage (every code section has an owning chain)
        run: npm run check:chains
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # Build must succeed with NO secrets - the app falls back to demo mode. This proves a
          # fresh clone builds green before any keys exist.
          NEXT_TELEMETRY_DISABLED: '1'

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install worker dependencies
        run: pip install -r requirements.txt
      - name: Worker tests
        run: python -m pytest tests -q
