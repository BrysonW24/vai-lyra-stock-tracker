name: Hourly Stock Scanner

# Runs the Python scanner twice an hour. Configure the secrets below in:
# Settings -> Secrets and variables -> Actions.
# With no secrets set, the worker no-ops safely - the dashboard still runs on demo data.

on:
  schedule:
    # Two firings an hour at uncongested minutes. GitHub load-sheds scheduled runs
    # (observed: the single ':05' cron actually fired every ~2h for days, including
    # dropped 13:05/14:05 slots during US market open) - two offset attempts restore
    # a real hourly cadence. Congested minutes (:00/:05/:30) are dropped most, so odd
    # offsets. Cron is UTC. The concurrency group queues a second firing behind a
    # running one.
    #
    # It runs around the clock on purpose (ENABLE_MARKET_HOURS_GUARD=false in the repo
    # variables): the app marks a scan older than 2h as stale and renders a guard-skipped
    # run as a failed one, so skipping the closed-market hours would put a red badge on the
    # header for the whole Australian day. Do not flip the guard on until the freshness
    # model is market-aware. What made the closed-market runs expensive was never the
    # schedule - it was each run rewriting the whole candle history (see
    # workers/stock_scanner/candle_persistence.py), and that is fixed at the source.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: {}

# Least privilege. `actions: write` exists only so the keepalive step can re-enable the
# scheduled workflows - without it that call is refused (HTTP 403) and the crons quietly
# die after 60 days without a push.
permissions:
  contents: read
  actions: write

concurrency:
  group: hourly-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pull SUPABASE_* secrets + ENABLE_MARKET_HOURS_GUARD etc. from the "Production"
    # GitHub environment so they don't have to be duplicated as repo-level secrets/vars.
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-worker

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEFAULT_USER_ID: ${{ secrets.DEFAULT_USER_ID }}
          # Multi-channel notification dispatch (web push + WhatsApp). Without these the
          # scanner can ONLY fire legacy single-operator Telegram - push never reaches users.
          # APP_BASE_URL is the deployed Vercel URL; the worker derives the dispatch endpoint
          # from it. NOTIFICATION_DISPATCH_SECRET must MATCH the Vercel function env value.
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL }}
          NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_DATA_PROVIDER: ${{ vars.MARKET_DATA_PROVIDER || 'yfinance' }}
          TICKER_SYMBOLS: ${{ vars.TICKER_SYMBOLS }}
          DEFAULT_TIMEFRAME: ${{ vars.DEFAULT_TIMEFRAME || '1h' }}
          ENABLE_TELEGRAM_ALERTS: ${{ vars.ENABLE_TELEGRAM_ALERTS || 'true' }}
          ENABLE_MARKET_HOURS_GUARD: ${{ vars.ENABLE_MARKET_HOURS_GUARD || 'true' }}
        run: python -m workers.stock_scanner.main

      # A silent scanner death was invisible except as a stale badge in the app header -
      # and for four days in September 2026 that is all there was. The paging credentials
      # are their own OPS_* secrets so that wiring them cannot change what the scanner
      # itself sends (TELEGRAM_* above also arms the worker's legacy alert path).
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: Lyra hourly scanner FAILED
          telegram-bot-token: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          slack-webhook: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}

      - name: Keepalive (reset the 60-day cron auto-disable clock)
        if: always()
        uses: ./.github/actions/keepalive
        with:
          token: ${{ github.token }}
