name: Hourly Stock Scanner

# Runs the Python momentum scanner once an hour during/around US market hours.
# Configure the secrets below in: Settings -> Secrets and variables -> Actions.
# With no secrets set, the worker no-ops safely - the dashboard still runs on demo data.

on:
  schedule:
    # Two firings an hour at uncongested minutes. GitHub load-sheds scheduled runs
    # (observed: the single ':05' cron actually fired every ~2h for days, including
    # dropped 13:05/14:05 slots during US market open) - two offset attempts restore
    # a real hourly cadence. Congested minutes (:00/:05/:30) are dropped most, so odd
    # offsets. Cron is UTC. The worker's market-hours guard decides whether to scan,
    # and the concurrency group queues a second firing behind a running one.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hourly-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pull SUPABASE_* secrets + ENABLE_MARKET_HOURS_GUARD etc. from the "Production"
    # GitHub environment so they don't have to be duplicated as repo-level secrets/vars.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEFAULT_USER_ID: ${{ secrets.DEFAULT_USER_ID }}
          # Multi-channel notification dispatch (web push + WhatsApp). Without these the
          # scanner can ONLY fire legacy single-operator Telegram - push never reaches users.
          # APP_BASE_URL is the deployed Vercel URL; the worker derives the dispatch endpoint
          # from it. NOTIFICATION_DISPATCH_SECRET must MATCH the Vercel function env value.
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL }}
          NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKET_DATA_PROVIDER: ${{ vars.MARKET_DATA_PROVIDER || 'yfinance' }}
          TICKER_SYMBOLS: ${{ vars.TICKER_SYMBOLS }}
          DEFAULT_TIMEFRAME: ${{ vars.DEFAULT_TIMEFRAME || '1h' }}
          ENABLE_TELEGRAM_ALERTS: ${{ vars.ENABLE_TELEGRAM_ALERTS || 'true' }}
          ENABLE_MARKET_HOURS_GUARD: ${{ vars.ENABLE_MARKET_HOURS_GUARD || 'true' }}
        run: python -m workers.stock_scanner.main

      # A silent scanner death was invisible except as a stale badge in the app header.
      # On failure, page the operator on every channel that has credentials configured.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_FEEDBACK_WEBHOOK_URL }}
        run: |
          MSG="Lyra hourly scanner FAILED - run ${{ github.run_id }} on ${{ github.repository }}. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" > /dev/null || true
          fi
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -sf -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: $MSG\"}" "$SLACK_WEBHOOK" > /dev/null || true
          fi

      # GitHub auto-disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API on every run resets that clock, so the cron cannot
      # silently die during a quiet development stretch.
      - name: Keepalive (reset the 60-day cron auto-disable clock)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/hourly-stock-scanner.yml/enable" || true
